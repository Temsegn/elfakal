services:
  - type: web
    name: elfakal-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@elfakal.com
      - key: ADMIN_NAME
        value: System Admin
      # Set these manually in the Render dashboard:
      # ADMIN_PASSWORD  — strong password for the admin account
      # DATABASE_URL    — your PostgreSQL connection string (e.g. from Neon)
      # CORS_ORIGIN     — your Vercel frontend URL (e.g. https://elfakal.vercel.app)
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
